events {}

http {
  # 요청 한 건당 한 줄 (JSON). us/uct가 "-"이면 앱에 연결하지 못한 것.
  log_format j escape=json '{"t":$msec,"src":"$remote_addr","path":"$uri","status":$status,'
                           '"rt":$request_time,"us":"$upstream_status","uct":"$upstream_connect_time"}';
  access_log /var/log/nginx/access.jsonl j;

  # 앱 컨테이너가 재시작돼 주소가 바뀌어도 다시 찾도록 매 요청 이름을 풀어 쓴다
  resolver 127.0.0.11 valid=1s ipv6=off;

  server {
    listen 80;
    set $upstream http://app:8000;
    include /etc/nginx/dynamic/*.conf;   # 에이전트가 쓰는 출발지 제한 목록, 예비 앱 전환(upstream.conf가 $upstream을 바꾼다)

    location / {
      proxy_pass $upstream;
      proxy_connect_timeout 1s;
      proxy_read_timeout 10s;
    }
  }
}
